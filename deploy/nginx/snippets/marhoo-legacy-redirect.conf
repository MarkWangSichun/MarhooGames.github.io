# The media page moved from /editorial/focus/ to /press/pomoveggie/.
# Links sent to App Store editors and press must keep working indefinitely, so
# every shape of the old address redirects in a single hop:
#   /editorial, /editorial/, /editorial/focus, /editorial/focus/, and any old
#   asset path under /editorial/ (the files no longer exist, they moved too).

location = /editorial {
	return 301 /press/pomoveggie/;
}

location = /editorial/focus {
	return 301 /press/pomoveggie/;
}

location /editorial/ {
	return 301 /press/pomoveggie/;
}

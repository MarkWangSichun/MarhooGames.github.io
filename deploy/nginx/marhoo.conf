# Source of truth for https://marhoo.com.
#
# scripts/deploy.sh uploads this directory to /opt/marhoo/nginx/ and
# scripts/deploy_remote.sh symlinks the files into /etc/nginx/. The copy under
# /etc/nginx is therefore a link, not a file: change the configuration here, in
# git, and deploy. Editing it on the server only lasts until the next deploy.
#
# Certificate renewal is handled by certbot on the host and is not deployed from
# this repository; the letsencrypt paths below depend on it.
#
# This static site does not proxy requests to application backends.

server {
	# Port 80 default_server. Catches requests that arrive with a Host header
	# this box does not know (bare IP, robots hitting the IPv4 directly).
	#
	# IMPORTANT: exactly one server block may claim default_server per port.
	# A second one anywhere under conf.d makes nginx refuse to start with
	# "a duplicate default server" -- the running process keeps serving, so the
	# breakage only shows up on the next reload or reboot.
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	root /var/www/html/marhoo_home_page;
	index index.html;
	include /etc/nginx/snippets/marhoo-legacy-redirect.conf;

	location / {
		try_files $uri $uri/ $uri.html =404;
	}

	error_page 404 /404.html;
}

server {
	listen 80;
	listen [::]:80;
	server_name marhoo.com www.marhoo.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name marhoo.com www.marhoo.com;
	root /var/www/html/marhoo_home_page;
	index index.html;
	include /etc/nginx/snippets/marhoo-legacy-redirect.conf;

	location / {
		try_files $uri $uri/ $uri.html =404;
	}

	error_page 404 /404.html;

	ssl_certificate /etc/letsencrypt/live/marhoo.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/marhoo.com/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
